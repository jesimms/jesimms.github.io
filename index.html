<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James E. Simms III</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Professional blue gradient background */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            margin: 0 0 15px;
            font-size: 32px;
            color: #222;
        }
        p {
            margin: 0 0 30px;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        .email-button {
            display: inline-block;
            background-color: #2a5298;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .email-button:hover {
            background-color: #1e3c72;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Your Name -->
        <h1>James E Simms III</h1>
        
        <!-- Brief Message -->
        <p>Welcome! I am currently putting together my service offerings. In the meantime, please feel free to get in touch directly.</p>
        
        <!-- Email Button -->
        <a href="mailto:hello@james-simms.com" class="email-button">hello@james-simms.com</a>
    </div>

</body>
</html>
